name: Build LK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lk-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Important: Initialize submodules

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make file libc6-i386 \
            lib32stdc++6 lib32z1 \
            python3 python3-pip \
            device-tree-compiler

      - name: Cache Toolchain
        id: cache-gcc
        uses: actions/cache@v4
        with:
          path: ~/gcc-toolchain
          key: arm-linux-androideabi-4.9-v1

      - name: Download Toolchain
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          # Use a more reliable mirror or AOSP source
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            ~/gcc-toolchain || \
          # Fallback to GitHub mirror if AOSP is unreachable
          git clone --depth=1 \
            https://github.com/AndroidSDK/prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            ~/gcc-toolchain

      - name: Setup Toolchain
        run: |
          # Verify toolchain structure
          ls -la ~/gcc-toolchain/
          ls -la ~/gcc-toolchain/bin/ || true
          
          # Find actual GCC location
          GCC_PATH=$(find ~/gcc-toolchain -name "arm-linux-androideabi-gcc" -type f | head -1)
          if [ -n "$GCC_PATH" ]; then
            GCC_DIR=$(dirname "$GCC_PATH")
            echo "GCC_DIR=$GCC_DIR" >> $GITHUB_ENV
            echo "Found GCC at: $GCC_PATH"
          else
            echo "GCC not found in toolchain directory"
            echo "Available files:"
            find ~/gcc-toolchain -type f | head -20
            exit 1
          fi

      - name: Fix permissions for scripts
        run: |
          chmod -R +x scripts/dct || true
          chmod +x scripts/dct/DrvGen || true
          chmod +x scripts/dct/*.pl || true
          chmod +x scripts/drvgen/*.mk || true
          chmod +x makefile || true
          chmod +x make-make || true

      - name: Check DrvGen compatibility
        run: |
          file scripts/dct/DrvGen
          ldd scripts/dct/DrvGen || true
          # If DrvGen is a 32-bit binary, install 32-bit libraries
          if file scripts/dct/DrvGen | grep -q "32-bit"; then
            sudo apt-get install -y libc6-i386 lib32stdc++6
          fi

      - name: Verify DCT workspace file
        run: |
          DWS_FILE="target/fpga6589/dct/dct/codegen.dws"
          if [ ! -f "$DWS_FILE" ]; then
            echo "ERROR: DWS file not found at $DWS_FILE"
            echo "Available DCT files:"
            find target/fpga6589/dct -type f || true
            echo "Looking for any .dws files:"
            find . -name "*.dws" || true
            # Try to generate or find alternative
            echo "Creating dummy DWS file for testing..."
            mkdir -p target/fpga6589/dct/dct
            # Check if there's a workspace file elsewhere
            find . -name "*.dws" -exec cp {} target/fpga6589/dct/dct/codegen.dws \; || true
          else
            echo "DWS file found"
            cat "$DWS_FILE" | head -20
          fi

      - name: Build LK
        run: |
          # Use the GCC directory found
          if [ -n "$GCC_DIR" ]; then
            export PATH=$GCC_DIR:$PATH
          else
            export PATH=$HOME/gcc-toolchain/bin:$PATH
          fi
          
          export CROSS_COMPILE=arm-linux-androideabi-
          export CC=arm-linux-androideabi-gcc
          export CXX=arm-linux-androideabi-g++
          
          echo "PATH: $PATH"
          echo "=== Checking compiler ==="
          which arm-linux-androideabi-gcc || echo "GCC not found in PATH"
          arm-linux-androideabi-gcc --version || echo "GCC version check failed"
          
          echo "=== Starting build ==="
          make fpga6589

      - name: List output
        if: always()
        run: |
          echo "=== Build artifacts ==="
          find . -name "*.img" -o -name "*.bin" -o -name "lk*" -o -name "*.elf" || true
          echo "=== Build directory ==="
          ls -la build-fpga6589/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lk-build
          path: |
            build-fpga6589
            *.img
            *.bin
            lk
          if-no-files-found: warn
          retention-days: 30
