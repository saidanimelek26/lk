name: Build LK with Docker

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lk-build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with Docker
        uses: docker://ghcr.io/mediatek/lk-build:latest
        with:
          args: |
            bash -c "
              export CROSS_COMPILE=arm-linux-androideabi-
              make fpga6589
            "
