name: Build workflow

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lk-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout sources
      uses: actions/checkout@v4
      
    - name: Install pyenv and Python 2.7.18
      run: |
        # Install dependencies
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev curl git libncursesw5-dev xz-utils tk-dev libffi-dev liblzma-dev gcc-arm-none-eabi make
        
        # Install pyenv
        curl https://pyenv.run | bash
        
        # Setup pyenv
        export PYENV_ROOT="$HOME/.pyenv"
        export PATH="$PYENV_ROOT/bin:$PATH"
        eval "$(pyenv init -)"
        
        # Install Python 2.7.18
        CFLAGS="-std=c11" pyenv install 2.7.18
        pyenv global 2.7.18
        
    - name: Build the bootloader
      run: |
        export PYENV_ROOT="$HOME/.pyenv"
        export PATH="$PYENV_ROOT/bin:$PATH"
        eval "$(pyenv init -)"
        export python=python2
        make fpga6589
        
    - name: Upload bootloader
      uses: actions/upload-artifact@v4
      with:
        name: fpga6589_lk.img
        path: build-fpga6589/lk.img
        if-no-files-found: error
        retention-days: 90
