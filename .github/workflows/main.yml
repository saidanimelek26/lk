name: Build LK Bootloader for fpga6589

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lk-build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout sources
      uses: actions/checkout@v4

    - name: Install Python 2
      run: |
        sudo apt-get update
        sudo apt-get install -y python2
        sudo ln -sf /usr/bin/python2 /usr/local/bin/python

    - name: Install 32-bit libraries
      run: |
        sudo apt-get install -y lib32stdc++6 lib32z1

    - name: Cache GCC toolchain
      id: cache-gcc
      uses: actions/cache@v4
      with:
        path: $HOME/gcc-toolchain
        key: gcc-toolchain-v1

    - name: Setup GCC toolchain
      run: |
        if [ ! -d "$HOME/gcc-toolchain/bin" ]; then
          echo "Cloning toolchain..."
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 $HOME/gcc-toolchain
          cd $HOME/gcc-toolchain
          git checkout e9b2ab0932573a0ca90cad11ab75d9619f19c458
          echo "ready" > $HOME/gcc-toolchain/.ready
        else
          echo "Toolchain already cached, skipping clone."
        fi

    - name: Fix DrvGen permissions
      run: |
        chmod +x scripts/dct/DrvGen

    - name: Debug DWS file
      run: |
        echo "=== Checking DWS file ==="
        DWS_FILE="target/fpga6589/dct/dct/codegen.dws"
        if [ -f "$DWS_FILE" ]; then
          echo "✅ DWS file exists at: $DWS_FILE"
          echo "File size: $(ls -lh $DWS_FILE | awk '{print $5}')"
          echo "First 10 lines of DWS file:"
          head -10 "$DWS_FILE"
        else
          echo "❌ DWS file NOT found at: $DWS_FILE"
          echo "Looking for DWS files in target directory:"
          find target -name "*.dws" 2>/dev/null || echo "No .dws files found"
        fi
        echo "=========================="

    - name: Build LK
      run: |
        export python=python2
        export TOOLCHAIN_PREFIX=$HOME/gcc-toolchain/bin/arm-linux-androideabi-
        make fpga6589

    - name: List build files
      run: |
        echo "=== Build directory contents ==="
        ls -lh build-fpga6589/ || true
        echo "================================"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: realme-fpga6589-complete
        path: |
          build-fpga6589/lk.img
