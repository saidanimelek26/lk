name: Build workflow

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lk-build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04

    steps:
    - name: Checkout sources
      uses: actions/checkout@v4
      
    - name: Install Python 2 and dependencies
      run: |
        apt-get update
        apt-get install -y python2 build-essential git make gcc-arm-none-eabi
        ln -sf /usr/bin/python2 /usr/local/bin/python
        
    - name: Verify Python installation
      run: |
        python --version
        which python
        
    - name: Build the bootloader
      run: |
        export python=python2
        make fpga6589
        
    - name: Upload bootloader
      uses: actions/upload-artifact@v4
      with:
        name: fpga6589_lk.img
        path: build-fpga6589/lk.img
        if-no-files-found: error
        retention-days: 90
