name: Build LK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lk-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git make file \
            libc6-i386 lib32stdc++6 lib32z1 \
            python3 python3-pip \
            device-tree-compiler \
            wget unzip curl \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Setup Android NDK
        id: setup-ndk
        run: |
          NDK_VERSION="r23c"
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          NDK_URL="https://dl.google.com/android/repository/${NDK_ZIP}"
          
          cd /tmp
          if [ ! -d "/home/runner/android-ndk-${NDK_VERSION}" ]; then
            echo "Downloading Android NDK..."
            wget -q --show-progress ${NDK_URL} || {
              echo "Falling back to alternative NDK version..."
              NDK_VERSION="r21e"
              NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
              NDK_URL="https://dl.google.com/android/repository/${NDK_ZIP}"
              wget -q --show-progress ${NDK_URL}
            }
            unzip -q ${NDK_ZIP}
            rm ${NDK_ZIP}
            mv android-ndk-* /home/runner/android-ndk-${NDK_VERSION}
          fi
          
          echo "NDK_ROOT=/home/runner/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV
          echo "NDK_BIN=/home/runner/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV
          
          # Create GCC compatibility wrappers with fixed path
          mkdir -p /home/runner/gcc-wrapper/bin
          
          cat > /home/runner/gcc-wrapper/bin/arm-linux-androideabi-gcc << 'EOF'
          #!/bin/bash
          # Find NDK bin directory
          NDK_BIN=""
          if [ -d "$HOME/android-ndk-r23c/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            NDK_BIN="$HOME/android-ndk-r23c/toolchains/llvm/prebuilt/linux-x86_64/bin"
          elif [ -d "$HOME/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            NDK_BIN="$HOME/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin"
          else
            # Try to find any NDK
            NDK_BIN=$(find $HOME -path "*/toolchains/llvm/prebuilt/linux-x86_64/bin" -type d 2>/dev/null | head -1)
          fi
          
          if [ -z "$NDK_BIN" ]; then
            echo "ERROR: Cannot find NDK bin directory"
            exit 1
          fi
          
          # Use clang directly from NDK bin
          exec "$NDK_BIN/armv7a-linux-androideabi21-clang" "$@"
          EOF
          
          cat > /home/runner/gcc-wrapper/bin/arm-linux-androideabi-g++ << 'EOF'
          #!/bin/bash
          # Find NDK bin directory
          NDK_BIN=""
          if [ -d "$HOME/android-ndk-r23c/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            NDK_BIN="$HOME/android-ndk-r23c/toolchains/llvm/prebuilt/linux-x86_64/bin"
          elif [ -d "$HOME/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            NDK_BIN="$HOME/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin"
          else
            # Try to find any NDK
            NDK_BIN=$(find $HOME -path "*/toolchains/llvm/prebuilt/linux-x86_64/bin" -type d 2>/dev/null | head -1)
          fi
          
          if [ -z "$NDK_BIN" ]; then
            echo "ERROR: Cannot find NDK bin directory"
            exit 1
          fi
          
          # Use clang++ directly from NDK bin
          exec "$NDK_BIN/armv7a-linux-androideabi21-clang++" "$@"
          EOF
          
          chmod +x /home/runner/gcc-wrapper/bin/*
          echo "GCC_WRAPPER=/home/runner/gcc-wrapper/bin" >> $GITHUB_ENV
          
          # Verify NDK
          echo "=== NDK bin contents ==="
          ls -la /home/runner/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/ | grep -E "armv7a|clang"
          
          # Verify wrapper scripts
          echo "=== Wrapper scripts ==="
          cat /home/runner/gcc-wrapper/bin/arm-linux-androideabi-gcc

      - name: Fix script permissions
        run: |
          find scripts -type f -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true
          find scripts/dct -type f -exec chmod +x {} \; 2>/dev/null || true
          chmod +x makefile make-make 2>/dev/null || true

      - name: Fix DrvGen binary
        run: |
          if [ -f "scripts/dct/DrvGen" ]; then
            chmod +x scripts/dct/DrvGen
            file scripts/dct/DrvGen
            if file scripts/dct/DrvGen | grep -q "32-bit"; then
              sudo apt-get install -y libc6-i386
            fi
          else
            echo "Warning: DrvGen not found"
          fi

      - name: Prepare DCT workspace
        run: |
          DWS_FILE="target/fpga6580/dct/dct/codegen.dws"
          if [ ! -f "$DWS_FILE" ]; then
            echo "Creating DWS file..."
            mkdir -p target/fpga6580/dct/dct
            cat > "$DWS_FILE" << 'DWS_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <workspace version="1.0">
            <project name="codegen">
              <settings>
                <setting name="target" value="fpga6580"/>
              </settings>
            </project>
          </workspace>
          DWS_EOF
          fi
          
          mkdir -p build-fpga6580/inc
          mkdir -p build-fpga6580/obj

      - name: Create fallback headers
        run: |
          cat > build-fpga6580/inc/cust_kpd.h << 'EOF'
          #ifndef _CUST_KPD_H_
          #define _CUST_KPD_H_
          #define KPD_KEY_DEBOUNCE_TIME 5
          #define KPD_PWRKEY_DEBOUNCE_TIME 10
          #define KPD_SLIDE_QWERTY 0
          #define KPD_SLIDE_PHONE 0
          #define KPD_PWRKEY_PMIC 1
          #define KPD_HW_KEY_CODE_MAP_SIZE 0
          #define KPD_HW_KEY_CODE_MAP { }
          #endif
          EOF
          
          cat > build-fpga6580/inc/cust_adc.h << 'EOF'
          #ifndef _CUST_ADC_H_
          #define _CUST_ADC_H_
          #define ADC_CHANNEL_BATTERY 0
          #define ADC_CHANNEL_TEMPERATURE 1
          #endif
          EOF
          
          echo "Fallback headers created in build-fpga6580/inc/"

      - name: Build LK
        id: build
        run: |
          export PATH=$GCC_WRAPPER:$NDK_BIN:$PATH
          export CROSS_COMPILE=arm-linux-androideabi-
          export CC=arm-linux-androideabi-gcc
          export CXX=arm-linux-androideabi-g++
          export AR=arm-linux-androideabi-ar
          export LD=arm-linux-androideabi-ld
          export STRIP=arm-linux-androideabi-strip
          
          echo "=== Environment ==="
          echo "PATH: $PATH"
          echo "CROSS_COMPILE: $CROSS_COMPILE"
          
          echo "=== Compiler check ==="
          which arm-linux-androideabi-gcc || echo "GCC not found"
          arm-linux-androideabi-gcc --version 2>&1 | head -5 || echo "Version check failed"
          
          echo "=== Start build ==="
          make fpga6580 2>&1 | tee build.log || {
            echo "=== Build failed with DCT, trying alternative ==="
            # Try to bypass DCT generation
            touch build-fpga6580/inc/cust_eint.h
            touch build-fpga6580/inc/cust_adc.h  
            touch build-fpga6580/inc/cust_kpd.h
            touch build-fpga6580/inc/cust_alsps.h
            touch build-fpga6580/inc/cust_acc.h
            touch build-fpga6580/inc/cust_gyro.h
            touch build-fpga6580/inc/cust_mag.h
            
            make fpga6580 2>&1 | tee -a build.log || {
              echo "=== Build failed, checking logs ==="
              tail -100 build.log
              exit 1
            }
          }

      - name: Check build results
        if: always()
        run: |
          echo "=== Build directory ==="
          ls -la build-fpga6580/ 2>/dev/null || echo "Build directory not found"
          
          echo "=== Build artifacts ==="
          find . -type f \( -name "*.img" -o -name "*.bin" -o -name "*.elf" -o -name "lk" -o -name "*.axf" \) 2>/dev/null | while read f; do
            echo "Found: $f ($(du -h "$f" | cut -f1))"
          done
          
          echo "=== Build log ==="
          if [ -f "build.log" ]; then
            echo "Last 50 lines of build log:"
            tail -50 build.log
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lk-build-output
          path: |
            build-fpga6580/
            build.log
            lk
            *.img
            *.bin
            *.elf
            *.axf
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            build.log
            build-fpga6580/*.log
            scripts/dct/*.log
          retention-days: 7
