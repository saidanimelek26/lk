name: Build LK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lk-build:
    runs-on: ubuntu-latest

    container:
      image: python:2.7

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            make \
            gcc \
            g++ \
            bc \
            bison \
            flex \
            libssl-dev \
            gcc-arm-none-eabi

      - name: Verify environment
        run: |
          python --version
          gcc --version
          make --version

      - name: Build LK
        run: |
          make fpga6589

      - name: Find output
        run: |
          find . -name "*.bin" -o -name "*.img" -o -name "lk*" | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lk-build-output
          path: |
            build-*/lk.bin
            build-*/lk.img
            out/**/*.bin
            out/**/*.img
          if-no-files-found: warn
