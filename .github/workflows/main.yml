name: Build workflow

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lk-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout sources
      uses: actions/checkout@v4
      
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git make gcc-arm-none-eabi wget libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libncurses5-dev
        
    - name: Build Python 2 from source
      run: |
        cd /tmp
        wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
        tar -xzf Python-2.7.18.tgz
        cd Python-2.7.18
        ./configure --prefix=/usr/local/python2 --enable-optimizations
        make -j$(nproc)
        sudo make install
        sudo ln -sf /usr/local/python2/bin/python2 /usr/local/bin/python
        
    - name: Verify Python installation
      run: |
        python --version
        which python
        
    - name: Build the bootloader
      run: |
        export python=python2
        PATH=/usr/local/python2/bin:$PATH
        make fpga6589
        
    - name: Upload bootloader
      uses: actions/upload-artifact@v4
      with:
        name: fpga6589_lk.img
        path: build-fpga6589/lk.img
        if-no-files-found: error
        retention-days: 90
